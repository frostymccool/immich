name: Build Custom APK

on:
  push:
    branches:
      - feature/custom-upload-settings
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Mise
        uses: jdx/mise-action@v2
        with:
          working_directory: mobile

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate translation files
        working-directory: mobile
        run: dart run easy_localization:generate -S ../i18n

      - name: Run Dart code generation
        working-directory: mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate platform APIs (Pigeon)
        working-directory: mobile
        run: ls pigeon/*.dart | xargs -n1 -P4 -I{} dart run pigeon --input {}

      - name: Build APK (release)
        working-directory: mobile
        run: flutter build apk --release --no-pub

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: immich-custom-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
